services:
  web:
    build: .
    container_name: cloud_web
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud_app_net
      - cloud_db_net

  db:
    image: mariadb:11.4
    container_name: cloud_db
    environment:
      MARIADB_DATABASE: cloud
      MARIADB_USER: cloud_user
      MARIADB_PASSWORD: cloud_pass
      MARIADB_ROOT_PASSWORD: root_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cloud_db_net

networks:
  cloud_app_net:
    driver: bridge
  cloud_db_net:
    driver: bridge

volumes:
  db_data:
